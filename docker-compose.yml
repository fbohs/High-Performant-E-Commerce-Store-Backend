services:
  # =====================================================
  # Application Instances (5 instances for nginx LB)
  # =====================================================
  # app-1:
  #   <<: *app-common
  #   container_name: ecommerce_app_1
  #   ports:
  #     - "3001:3000"

  # app-2:
  #   <<: *app-common
  #   container_name: ecommerce_app_2
  #   ports:
  #     - "3002:3000"

  # app-3:
  #   <<: *app-common
  #   container_name: ecommerce_app_3
  #   ports:
  #     - "3003:3000"

  # app-4:
  #   <<: *app-common
  #   container_name: ecommerce_app_4
  #   ports:
  #     - "3004:3000"

  # app-5:
  #   <<: *app-common
  #   container_name: ecommerce_app_5
  #   ports:
  #     - "3005:3000"

  # =====================================================
  # Redis
  # =====================================================
  ecommerce_redis:
    image: redis:alpine3.22
    container_name: ecommerce_redis
    restart: always
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - ecommerce_redis_data:/data
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - "${REDIS_PASSWORD}"
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    networks:
      - app_network

  # =====================================================
  # PostgreSQL
  # =====================================================
  ecommerce_postgres:
    image: postgres:16.11-alpine
    container_name: ecommerce_postgres
    environment:
      POSTGRES_DB: "${DOCKER_DATABASE_NAME}"
      POSTGRES_USER: "${DOCKER_DATABASE_USERNAME}"
      POSTGRES_PASSWORD: "${DOCKER_DATABASE_PASSWORD}"
    ports:
      - "${DOCKER_DATABASE_PORT}:5432"
    volumes:
      - ecommerce_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DOCKER_DATABASE_USERNAME} -d ${DOCKER_DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  ecommerce_redis_data:
    driver: local
  ecommerce_postgres_data:
    driver: local
